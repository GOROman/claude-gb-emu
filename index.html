<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Game Boy Color Emulator (WASM)</title>
<style>
  :root {
    --bg: #1a1a22;
    --panel: #26262f;
    --fg: #e8e8f0;
    --accent: #7b68ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
    touch-action: manipulation;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 4px 0 10px; letter-spacing: .05em; }
  h1 .cgb { color: var(--accent); }
  #toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px;
  }
  button, label.btn {
    background: var(--panel); color: var(--fg); border: 1px solid #3a3a48;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  #screenWrap {
    background: #000; border: 4px solid #333; border-radius: 8px;
    line-height: 0; position: relative;
  }
  canvas#screen {
    width: min(480px, 92vw);
    aspect-ratio: 160 / 144;
    image-rendering: pixelated;
  }
  #dropHint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 14px; text-align: center; line-height: 1.6; pointer-events: none;
  }
  #status { font-size: 12px; color: #999; margin-top: 8px; min-height: 1.2em; }
  #keys { font-size: 11px; color: #777; margin-top: 4px; }
  /* touch pad */
  #touchpad {
    display: none; width: 100%; max-width: 480px; margin-top: 14px;
    justify-content: space-between; align-items: center; user-select: none;
    -webkit-user-select: none;
  }
  body.touch #touchpad { display: flex; }
  #dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .dbtn, .abtn, .sbtn {
    background: var(--panel); border: 1px solid #3a3a48; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #bbb;
  }
  .dbtn:active, .abtn:active, .sbtn:active, .pressed { background: var(--accent); color: #fff; }
  #abgroup { display: flex; gap: 14px; }
  .abtn { width: 58px; height: 58px; border-radius: 50%; font-weight: 700; }
  #ssgroup { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
  .sbtn { padding: 6px 18px; font-size: 12px; border-radius: 14px; }
</style>
</head>
<body>
<h1>GAME BOY <span class="cgb">COLOR</span> — WASM Emulator</h1>

<div id="toolbar">
  <label class="btn">Open ROM<input type="file" id="romFile" accept=".gb,.gbc,.bin" style="display:none"></label>
  <button id="btnReset">Reset</button>
  <button id="btnMute">🔊 Sound</button>
  <button id="btnFull">⛶ Fullscreen</button>
</div>

<div id="screenWrap">
  <canvas id="screen" width="160" height="144"></canvas>
  <div id="dropHint">.gb / .gbc ファイルを<br>ドロップ or「Open ROM」</div>
</div>
<div id="status"></div>
<div id="keys">⌨ 十字キー: 矢印 / A: X / B: Z / START: Enter / SELECT: Shift &nbsp;·&nbsp; 🎮 ゲームパッド対応</div>

<div id="touchpad">
  <div id="dpad">
    <div></div><div class="dbtn" data-btn="4">▲</div><div></div>
    <div class="dbtn" data-btn="2">◀</div><div></div><div class="dbtn" data-btn="1">▶</div>
    <div></div><div class="dbtn" data-btn="8">▼</div><div></div>
  </div>
  <div>
    <div id="abgroup">
      <div class="abtn" data-btn="32">B</div>
      <div class="abtn" data-btn="16">A</div>
    </div>
    <div id="ssgroup">
      <div class="sbtn" data-btn="64">SELECT</div>
      <div class="sbtn" data-btn="128">START</div>
    </div>
  </div>
</div>

<script>window.GB_VER='1787532466';</script>
<script src="gbc.js?v=1787532466"></script>
<script src="main.js?v=1787532466"></script>
</body>
</html>
